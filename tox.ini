[tox]
isolated_build = true
envlist = black, mypy, pylint, bandit

[testenv]
whitelist_externals = poetry
commands =
    poetry install -v

[testenv:black]
description = 'Check code style with Black'
commands = poetry run black --check dashboard_stats/

[testenv:mypy]
description = 'Execute static analysis with mypy (type annotations).'
commands = poetry run mypy dashboard_stats/

[testenv:pylint]
description = 'Execute static analysis with pylint.'
commands = poetry run pylint dashboard_stats/

[testenv:bandit]
description = 'Execute static analysis with bandit.'
commands = poetry run bandit -r dashboard_stats/
