name: Test

on:
  - push
  - pull_request

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v1

      - name: Set up Python
        uses: actions/setup-python@v1
        with:
          python-version: 3.6

      - name: Install and configure Poetry
        uses: snok/install-poetry@v1.1.8

      - name: Install dependencies
        run: |
          poetry install

      - name: Test with tox
        run: tox
